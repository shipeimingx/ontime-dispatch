<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title desc"><title id="title">Exception Handling — Proposed extension</title><desc id="desc">Editable low fidelity OnTime Dispatch design. Illustrative data, independently calculated with demo-v1, not an operational screenshot.</desc><style>text{font-family:"Source Han Sans SC","Source Han Sans CN","Noto Sans CJK SC",sans-serif;fill:#182936;font-size:16px} .muted{fill:#5C6C75}</style>
